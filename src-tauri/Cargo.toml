[package]
name = "pos-limpieza"
version = "1.0.0"
description = "Sistema Punto de Venta (POS) a Medida - Tienda de Productos de Limpieza"
authors = ["POS Limpieza"]
edition = "2021"

[lib]
name = "pos_limpieza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Printing",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
